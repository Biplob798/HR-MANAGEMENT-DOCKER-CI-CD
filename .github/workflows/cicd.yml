name: HR CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ---------- CI: GitHub's cloud ----------
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Use example env for validation
        run: cp .env.example .env

      - name: Validate compose file
        run: docker compose config -q

      - name: Build backend and frontend images
        run: docker compose build

  # ---------- CD: your Windows PC ----------
  deploy:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Copy real .env
        shell: powershell
        run: Copy-Item C:\deploy\hr\.env .env -Force

      - name: Deploy
        shell: powershell
        run: docker compose -p hr-management up -d --build

      - name: Smoke test (frontend must answer on 8080)
        shell: powershell
        run: |
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            try {
              $r = Invoke-WebRequest -Uri http://localhost:8080 -UseBasicParsing -TimeoutSec 5
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { }
            Start-Sleep -Seconds 5
          }
          if (-not $ok) {
            docker compose -p hr-management logs --tail 50
            exit 1
          }
          Write-Host "Frontend is up"

      - name: Show status
        if: always()
        shell: powershell
        run: |
          docker compose -p hr-management ps
          docker compose -p hr-management logs backend --tail 20